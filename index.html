<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskly</title>
  <meta name="description" content="Taskly: a calendar for your todos.">
  <meta name="apple-mobile-web-app-title" content="Taskly">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <section class="calendar">
      <header class="cal-head">
        <div>
          <p class="brand">✓ Taskly</p>
          <h1 id="month-label"></h1>
        </div>
        <div class="nav">
          <button type="button" id="prev" aria-label="Previous month">‹</button>
          <button type="button" id="today">Today</button>
          <button type="button" id="next" aria-label="Next month">›</button>
        </div>
      </header>
      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <h2 id="day-label"></h2>
        <p class="muted" id="day-count"></p>
        <form id="add-form" class="add" autocomplete="off">
          <input id="add-text" placeholder="Add a todo…" maxlength="120" required aria-label="Todo">
          <input id="add-time" type="time" aria-label="Time (optional)">
          <button type="submit" class="primary">Add</button>
        </form>
        <ul class="todos" id="day-todos"></ul>
      </section>

      <section class="panel">
        <h2>Coming up</h2>
        <ul class="upcoming" id="upcoming"></ul>
      </section>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
