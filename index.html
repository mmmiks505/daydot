<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daydot</title>
  <meta name="description" content="Daydot: a calendar for your todos.">
  <meta name="apple-mobile-web-app-title" content="Daydot">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><circle cx='50' cy='50' r='20' fill='white'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Calendar -->
  <main class="view" id="view-calendar" data-view="calendar">
    <div class="cal-layout">
      <section class="card calendar">
        <header class="cal-head">
          <div>
            <p class="brand">● Daydot</p>
            <h1 id="month-label"></h1>
          </div>
          <div class="nav">
            <button type="button" id="prev" aria-label="Previous">‹</button>
            <button type="button" id="today">Today</button>
            <button type="button" id="next" aria-label="Next">›</button>
          </div>
        </header>
        <div class="seg mode-seg" id="mode-seg" role="radiogroup" aria-label="Calendar view">
          <button type="button" data-mode="month">Month</button>
          <button type="button" data-mode="week">Week</button>
          <button type="button" data-mode="day">Day</button>
        </div>
        <div class="weekdays" id="weekdays"></div>
        <div class="grid" id="grid"></div>
      </section>

      <section class="card">
        <h2 id="day-label"></h2>
        <p class="muted" id="day-count"></p>
        <form id="day-form" class="add" autocomplete="off">
          <input id="day-text" placeholder="Add a todo…" maxlength="120" required aria-label="Todo">
          <input id="day-time" type="time" aria-label="Time (optional)">
          <button type="submit" class="primary">Add</button>
        </form>
        <ul class="todos" id="day-todos"></ul>
      </section>
    </div>
  </main>

  <!-- To do -->
  <main class="view narrow" id="view-todo" data-view="todo" hidden>
    <header class="page-head">
      <p class="brand">● Daydot</p>
      <h1>To do</h1>
      <p class="muted" id="todo-summary"></p>
    </header>
    <form id="todo-form" class="card add add-wide" autocomplete="off">
      <input id="todo-text" placeholder="What do you need to do?" maxlength="120" required aria-label="Todo">
      <div class="add-row">
        <input id="todo-date" type="date" required aria-label="Date">
        <input id="todo-time" type="time" aria-label="Time (optional)">
        <button type="submit" class="primary">Add</button>
      </div>
    </form>
    <div class="filters" role="tablist" aria-label="Show">
      <button type="button" class="filter active" data-filter="open" role="tab" aria-selected="true">To do</button>
      <button type="button" class="filter" data-filter="done" role="tab" aria-selected="false">Done</button>
      <button type="button" class="filter" data-filter="all" role="tab" aria-selected="false">All</button>
    </div>
    <div id="todo-groups"></div>
  </main>

  <!-- Profile -->
  <main class="view narrow" id="view-profile" data-view="profile" hidden>
    <header class="page-head">
      <p class="brand">● Daydot</p>
      <h1>Profile</h1>
    </header>
    <section class="card profile-top">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="profile-name">
        <label for="name-input" class="muted small">Your name</label>
        <input id="name-input" maxlength="40" placeholder="Add your name">
      </div>
    </section>
    <section class="stats" id="stats"></section>
    <section class="card settings">
      <h2>Settings</h2>
      <div class="setting">
        <span>Appearance</span>
        <div class="seg" id="theme-seg" role="radiogroup" aria-label="Appearance">
          <button type="button" data-theme-choice="auto">Auto</button>
          <button type="button" data-theme-choice="light">Light</button>
          <button type="button" data-theme-choice="dark">Dark</button>
        </div>
      </div>
      <div class="setting">
        <span>Week starts on</span>
        <div class="seg" id="week-seg" role="radiogroup" aria-label="Week starts on">
          <button type="button" data-week="0">Sun</button>
          <button type="button" data-week="1">Mon</button>
        </div>
      </div>
      <div class="setting">
        <span>Your data</span>
        <div class="setting-actions">
          <button type="button" id="export">Export</button>
          <label class="btn">Import<input type="file" id="import" accept="application/json" hidden></label>
        </div>
      </div>
      <div class="setting">
        <span>Clear finished todos</span>
        <button type="button" id="clear-done" class="danger">Clear</button>
      </div>
      <p class="muted small">Your todos are saved in this browser only.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#calendar" class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </a>
    <a href="#todo" class="tab" data-tab="todo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>
      <span>To do</span>
      <b class="badge" id="todo-badge" hidden></b>
    </a>
    <a href="#profile" class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
